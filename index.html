<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gebäude-Buchungssystem</title>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@fullcalendar/core@6.1.11/locales-all.global.min.js"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="footer.css">
</head>
<body>

<header class="site-header">
    <div class="header-container">

        <div class="logo-wrapper">
            <img src="logo.png" alt="Stadt Hünfeld Logo" class="logo">
        </div>

        <nav class="main-nav">
            <a href="#" class="nav-btn">Bürgerservice & Politik</a>
            <a href="#" class="nav-btn">Digitaler Service</a>
            <a href="#" class="nav-btn">Hünfeld – meine Stadt</a>
            <a href="#" class="nav-btn">Der Standort</a>
        </nav>

        <div class="header-actions">
            <button class="icon-btn" aria-label="Kontakt">
                <svg viewBox="0 0 24 24" class="header-icon">
                    <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
                    <path d="M9 12l2 2 4-4"></path>
                </svg>
            </button>

            <button class="icon-btn" aria-label="Benutzer">
                <svg viewBox="0 0 24 24" class="header-icon">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                    <path d="M16 11l2 2 4-4"></path>
                </svg>
            </button>

            <div class="divider"></div>

            <button class="search-btn" aria-label="Suche">
                <svg viewBox="0 0 24 24" class="search-icon">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
            </button>
        </div>

    </div>
</header>

<div class="screen-layout">

    <!-- LINKE SEITE: HIER LANDET DEIN PLAN -->
    <div class="linke-haelfte">

     <object id="mein-plan" data="gebaeudeplan.svg" type="image/svg+xml" width="100%" style="flex-grow: 1; min-height: 0;"></object>
     <button id="btn-termin-hinzufuegen" class="action-btn">Termin hinzufügen</button>

    </div>

    <!-- RECHTE SEITE: FÜR DEINE SPÄTEREN BUCHUNGS-FUNKTIONEN -->
    <div class="rechte-haelfte">
        <h2 id="info-titel" style="margin-top: 0; font-size: 1.2em; color: #333;">current chosen room: None</h2>
        <div id="calendar"></div>
    </div>

</div>

<!-- Modal für Termin-Details -->
<div id="termin-modal" class="modal">
    <div class="modal-content">
        <span class="close-btn">&times;</span>
        <h2>Termin Details</h2>
        <form id="termin-form">
            <div class="form-group">
                <label>Raum:</label>
                <select id="termin-raum" disabled></select>
            </div>
            <div class="form-group">
                <label>Anfang:</label>
                <input type="datetime-local" id="termin-anfang" disabled>
            </div>
            <div class="form-group">
                <label>Ende:</label>
                <input type="datetime-local" id="termin-ende" disabled>
            </div>
            <div class="form-group">
                <label>Bestuhlung:</label>
                <select id="termin-bestuhlung" disabled>
                    <option value="Standard">Standard</option>
                    <option value="U-Form">U-Form</option>
                    <option value="Kino">Kino</option>
                </select>
            </div>
            <div class="form-group">
                <label>Notizen:</label>
                <textarea id="termin-notizen" rows="4" disabled></textarea>
            </div>
            <div class="form-group">
                <label>Mieter:</label>
                <input type="text" id="termin-mieter" disabled>
            </div>
            <div class="form-group">
                <label>Personenanzahl:</label>
                <input type="number" id="termin-personenanzahl" disabled>
            </div>
            <div class="form-group checkbox-group">
                <input type="checkbox" id="termin-serientermin" disabled>
                <label for="termin-serientermin">Serientermin</label>
            </div>
            <div class="form-actions">
                <button type="button" id="btn-bearbeiten">Bearbeiten</button>
                <button type="button" id="btn-speichern" style="display: none;">Speichern</button>
            </div>
        </form>
    </div>
</div>
  <footer>
    <div class="footer">
        <p>Impressung:</p>
        <p>Mustermann GmbH</p>
        <p>Beispielstraße 123</p>
        <p>12345 Musterstadt</p>
        <p>Deutschland</p>
        <p>Telefon: 01234 567890</p>
        <p>Email: info@mustermann.de</p>
    </div>
</footer>

<script src="script.js"></script>
<script src="calendar.js"></script>

</body>
</html>
