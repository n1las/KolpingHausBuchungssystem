<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gebäude-Buchungssystem</title>
    <!-- Hier verknüpfen wir dein CSS -->
    <!-- FullCalendar Standard Library -->
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@fullcalendar/core@6.1.11/locales-all.global.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="screen-layout">

    <!-- LINKE SEITE: HIER LANDET DEIN PLAN -->
    <div class="linke-haelfte">

     <object id="mein-plan" data="gebaeudeplan.svg" type="image/svg+xml" width="100%" height="100%"></object>

    </div>

    <!-- RECHTE SEITE: FÜR DEINE SPÄTEREN BUCHUNGS-FUNKTIONEN -->
    <div class="rechte-haelfte">
        <h2 id="info-titel" style="margin-top: 0; font-size: 1.2em; color: #333;">current chosen room: None</h2>
        <div id="calendar"></div>
    </div>

</div>

<!-- Modal für Termin-Details -->
<div id="termin-modal" class="modal">
    <div class="modal-content">
        <span class="close-btn">&times;</span>
        <h2>Termin Details</h2>
        <form id="termin-form">
            <div class="form-group">
                <label>Raum:</label>
                <select id="termin-raum" disabled></select>
            </div>
            <div class="form-group">
                <label>Anfang:</label>
                <input type="datetime-local" id="termin-anfang" disabled>
            </div>
            <div class="form-group">
                <label>Ende:</label>
                <input type="datetime-local" id="termin-ende" disabled>
            </div>
            <div class="form-group">
                <label>Bestuhlung:</label>
                <select id="termin-bestuhlung" disabled>
                    <option value="Standard">Standard</option>
                    <option value="U-Form">U-Form</option>
                    <option value="Kino">Kino</option>
                </select>
            </div>
            <div class="form-group">
                <label>Notizen:</label>
                <textarea id="termin-notizen" rows="4" disabled></textarea>
            </div>
            <div class="form-group">
                <label>Mieter:</label>
                <input type="text" id="termin-mieter" disabled>
            </div>
            <div class="form-group">
                <label>Personenanzahl:</label>
                <input type="number" id="termin-personenanzahl" disabled>
            </div>
            <div class="form-group checkbox-group">
                <input type="checkbox" id="termin-serientermin" disabled>
                <label for="termin-serientermin">Serientermin</label>
            </div>
            <div class="form-actions">
                <button type="button" id="btn-bearbeiten">Bearbeiten</button>
                <button type="button" id="btn-speichern" style="display: none;">Speichern</button>
            </div>
        </form>
    </div>
</div>

<script src="script.js"></script>
<script src="calendar.js"></script>

</body>
</html>
